<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Vista previa del generador de certificados">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Documento certificado -->
  <g transform="translate(280,90)">
    <rect x="0" y="0" width="240" height="180" rx="10" fill="#f8fafc"/>
    <rect x="0" y="0" width="240" height="180" rx="10" fill="none" stroke="#4fd1c5" stroke-width="4"/>
    <circle cx="120" cy="60" r="26" fill="none" stroke="#a78bfa" stroke-width="5"/>
    <path d="M108 60 l9 9 l18 -20" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="105" width="160" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="60" y="123" width="120" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="75" y="140" width="90" height="6" rx="3" fill="#cbd5e1"/>
  </g>

  <!-- Flecha de automatizacion -->
  <g stroke="#4fd1c5" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M150 230 q100 60 130 30"/>
    <path d="M262 250 l20 12 l-6 -22"/>
  </g>
  <g stroke="#f472b6" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M650 230 q-100 60 -130 30"/>
    <path d="M538 250 l-20 12 l6 -22"/>
  </g>

  <!-- Icono hoja de calculo -->
  <g transform="translate(120,240)">
    <rect x="0" y="0" width="90" height="70" rx="8" fill="#f8fafc"/>
    <rect x="0" y="0" width="90" height="70" rx="8" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <line x1="0" y1="24" x2="90" y2="24" stroke="#94a3b8" stroke-width="2"/>
    <line x1="0" y1="47" x2="90" y2="47" stroke="#94a3b8" stroke-width="2"/>
    <line x1="30" y1="0" x2="30" y2="70" stroke="#94a3b8" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="70" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Pila de certificados generados -->
  <g transform="translate(590,235)">
    <rect x="10" y="10" width="80" height="60" rx="6" fill="#334155"/>
    <rect x="5" y="5" width="80" height="60" rx="6" fill="#475569"/>
    <rect x="0" y="0" width="80" height="60" rx="6" fill="#f8fafc"/>
    <circle cx="40" cy="24" r="10" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <rect x="16" y="42" width="48" height="5" rx="2.5" fill="#cbd5e1"/>
  </g>
</svg>
